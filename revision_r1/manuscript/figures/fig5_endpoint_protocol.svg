   <g id="text_1">
    <text style="fill: #25648a; font: 700 8.8px 'DejaVu Sans'; text-anchor: start" x="47.287675" y="20.266325" transform="rotate(-0 47.287675 20.266325)">Endpoint 1 · Sequence Reconstruction (Primary + Ablations)</text>
   </g>
   <g id="text_2">
    <text style="fill: #1f2328; font: 700 7.8px 'DejaVu Sans'; text-anchor: start" x="53.146675" y="41.321981" transform="rotate(-0 53.146675 41.321981)">Inputs &amp; Partition</text>
   </g>
   <g id="text_3">
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(53.146675 50.12573)">Sequence + RDKit descriptors</text>
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(53.146675 58.420823)">≤70% NW homology splits</text>
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(53.146675 66.715916)">Pilot (279/41) + DBAASP (3,120/223/222)</text>
   </g>
   <g id="text_4">
    <text style="fill: #1f2328; font: 700 7.8px 'DejaVu Sans'; text-anchor: start" x="248.251375" y="41.321981" transform="rotate(-0 248.251375 41.321981)">Controlled Comparison</text>
   </g>
   <g id="text_5">
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(248.251375 50.12573)">Matched VAE architecture &amp; decoder</text>
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(248.251375 58.477335)">CE21 vs MSE21 across KL-β (0.01–1.0),</text>
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(248.251375 66.772428)">loss scaling (21×) &amp; padding masking</text>
   </g>
   <g id="text_6">
    <text style="fill: #1f2328; font: 700 7.8px 'DejaVu Sans'; text-anchor: start" x="443.356075" y="41.321981" transform="rotate(-0 443.356075 41.321981)">Verified Outcome</text>
   </g>
   <g id="text_7">
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(443.356075 50.12573)">Untouched test: CE21 96.1% micro,</text>
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(443.356075 58.420823)">88.1% macro; MSE21 tuned 94.2%/84.1%</text>
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(443.356075 66.715916)">Rare-AA imbalance: ρ = 0.80</text>
   </g>
   <g id="text_8">
    <text style="fill: #2a8c82; font: 700 8.8px 'DejaVu Sans'; text-anchor: start" x="47.287675" y="94.354325" transform="rotate(-0 47.287675 94.354325)">Endpoint 2 · De Novo Generation (Primary + Statistical &amp; Higher-Order Gates)</text>
   </g>
   <g id="text_9">
    <text style="fill: #1f2328; font: 700 7.8px 'DejaVu Sans'; text-anchor: start" x="53.146675" y="115.409981" transform="rotate(-0 53.146675 115.409981)">Inputs &amp; Comparators</text>
   </g>
   <g id="text_10">
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(53.146675 124.21373)">Terminal state only (FREE / AMD)</text>
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(53.146675 132.508823)">Unigram, Bigram, Trigram, LSTM (63k/1.3M),</text>
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(53.146675 140.803916)">Transformer-LM (1.8M), GRU-VAE, VAE-DDPM</text>
   </g>
   <g id="text_11">
    <text style="fill: #1f2328; font: 700 7.8px 'DejaVu Sans'; text-anchor: start" x="248.251375" y="115.409981" transform="rotate(-0 248.251375 115.409981)">Multi-Seed &amp; Orthogonal Gates</text>
   </g>
   <g id="text_12">
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(248.251375 124.21373)">3–5 seeds × 128–256 seqs/terminal, 95% CI</text>
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(248.251375 132.508823)">Low-order (MMD², d_eff=1.54) + 3-mer JS</text>
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(248.251375 140.994432)">+ α-helical μ_H W₁ + ≥70% NW memorization</text>
   </g>
   <g id="text_13">
    <text style="fill: #1f2328; font: 700 7.8px 'DejaVu Sans'; text-anchor: start" x="443.356075" y="115.409981" transform="rotate(-0 443.356075 115.409981)">Verified Outcome</text>
   </g>
   <g id="text_14">
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(443.356075 124.21373)">AR models beat tuned 96%-recon VAEs</text>
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(443.356075 132.508823)">by ~20× on FREE MMD² &amp; beat Unigram</text>
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(443.356075 140.803916)">on 3-mer JS &amp; μ_H (p ≤ 0.028)</text>
   </g>
   <g id="text_15">
    <text style="fill: #b88426; font: 700 8.8px 'DejaVu Sans'; text-anchor: start" x="47.287675" y="168.442325" transform="rotate(-0 47.287675 168.442325)">Endpoint 3 · Experimental Antibacterial Activity (Separate Provenance-Explicit Case Study)</text>
   </g>
   <g id="text_16">
    <text style="fill: #1f2328; font: 700 7.8px 'DejaVu Sans'; text-anchor: start" x="53.146675" y="189.497981" transform="rotate(-0 53.146675 189.497981)">Provenance &amp; Funnel</text>
   </g>
   <g id="text_17">
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(53.146675 198.30173)">Prior multimodal VAE-DDPM (0% AMPGen</text>
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(53.146675 206.596823)">overlap); 1,000 → RDKit charge&gt;0, AMP&gt;0.9,</text>
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(53.146675 214.891916)">II 10–40, ≤70% id → 30 ordered → 27 assayed</text>
   </g>
   <g id="text_18">
    <text style="fill: #1f2328; font: 700 7.8px 'DejaVu Sans'; text-anchor: start" x="248.251375" y="189.497981" transform="rotate(-0 248.251375 189.497981)">Assay &amp; Sensitivity Audit</text>
   </g>
   <g id="text_19">
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(248.251375 198.30173)">MHB broth microdilution, 1% DMSO, 5×10⁵</text>
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(248.251375 206.596823)">CFU/mL, 37 °C 16–20 h, 4 ATCC strains × 3</text>
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(248.251375 214.891916)">reps; original MIC + 6-rule OD₆₀₀ audit</text>
   </g>
   <g id="text_20">
    <text style="fill: #1f2328; font: 700 7.8px 'DejaVu Sans'; text-anchor: start" x="443.356075" y="189.497981" transform="rotate(-0 443.356075 189.497981)">Verified Outcome</text>
   </g>
   <g id="text_21">
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(443.356075 198.30173)">S. aureus ≤31.25 µg/mL (3.1–12.9 µM):</text>
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(443.356075 206.596823)">6/27 invariant across 5 rules (105/108 cells);</text>
    <text style="fill: #1f2328; font: 6.85px 'DejaVu Sans'" transform="translate(443.356075 214.891916)">haemolysis/cytotoxicity remain unmeasured</text>
   </g>
   <g id="text_22">
    <text style="fill: #70757a; font: italic 7px 'DejaVu Sans'; text-anchor: middle" x="333.206875" y="235.035419" transform="rotate(-0 333.206875 235.035419)">Note: Horizontal arrows connect inputs to outputs within each endpoint. Endpoint 3 is an independent historical panel, not a head-to-head wet-lab assay of CE21 vs MSE21 vs AR outputs.</text>
   </g>
  </g>
 </g>
