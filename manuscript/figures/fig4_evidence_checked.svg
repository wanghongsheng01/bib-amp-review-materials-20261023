<svg xmlns="http://www.w3.org/2000/svg" width="510.0pt" height="252.0pt" viewBox="0 0 510.0 252.0">
<title>Three endpoints for evaluating peptide design</title>
<desc>Three independent left-to-right tracks show input, measurement and endpoint. Reconstruction and generation use computational data; antibacterial activity uses the 27-peptide assay panel. There are no cross-track connections.</desc>
<rect x="0" y="0" width="510" height="252" fill="white"/>
<text id="A-heading" x="4" y="20.0" text-anchor="start" font-family="DejaVu Sans" font-size="10.5" font-weight="700" fill="#242C32">A  Reconstruction</text>
<rect id="A-object-0" x="4" y="35.0" width="132" height="43" fill="#F0F5F8" stroke="#25648A" stroke-width="0.65"/>
<text id="A-object-0-name" x="70.0" y="52.0" text-anchor="middle" font-family="DejaVu Sans" font-size="9.4" font-weight="700" fill="#242C32">Target sequences</text>
<text id="A-object-0-detail" x="70.0" y="67.0" text-anchor="middle" font-family="DejaVu Sans" font-size="9.4" font-weight="400" fill="#242C32">41 development peptides</text>
<rect id="A-object-1" x="161" y="35.0" width="167" height="43" fill="#F0F5F8" stroke="#25648A" stroke-width="0.65"/>
<text id="A-object-1-name" x="244.5" y="52.0" text-anchor="middle" font-family="DejaVu Sans" font-size="9.4" font-weight="700" fill="#242C32">Posterior-mean decoding</text>
<text id="A-object-1-detail" x="244.5" y="67.0" text-anchor="middle" font-family="DejaVu Sans" font-size="9.4" font-weight="400" fill="#242C32">CE21 versus MSE21</text>
<rect id="A-object-2" x="353" y="35.0" width="153" height="43" fill="#F0F5F8" stroke="#25648A" stroke-width="0.65"/>
<text id="A-object-2-name" x="429.5" y="52.0" text-anchor="middle" font-family="DejaVu Sans" font-size="9.4" font-weight="700" fill="#242C32">Residue accuracy</text>
<text id="A-object-2-detail" x="429.5" y="67.0" text-anchor="middle" font-family="DejaVu Sans" font-size="9.4" font-weight="400" fill="#242C32">CE21: 497/701 (70.90%)</text>
<polygon id="A-input-to-measurement" points="140,56.97999999999999 153.6,56.97999999999999 153.6,58.80000000000001 157,56.5 153.6,54.19999999999999 153.6,56.02000000000001 140,56.02000000000001" fill="#242C32"/>
<polygon id="A-measurement-to-endpoint" points="332,56.97999999999999 345.6,56.97999999999999 345.6,58.80000000000001 349,56.5 345.6,54.19999999999999 345.6,56.02000000000001 332,56.02000000000001" fill="#242C32"/>
<text id="B-heading" x="4" y="102.0" text-anchor="start" font-family="DejaVu Sans" font-size="10.5" font-weight="700" fill="#242C32">B  Generation</text>
<rect id="B-object-0" x="4" y="117.0" width="132" height="43" fill="#F0F5F8" stroke="#25648A" stroke-width="0.65"/>
<text id="B-object-0-name" x="70.0" y="134.0" text-anchor="middle" font-family="DejaVu Sans" font-size="9.4" font-weight="700" fill="#242C32">Terminal condition</text>
<text id="B-object-0-detail" x="70.0" y="149.0" text-anchor="middle" font-family="DejaVu Sans" font-size="9.4" font-weight="400" fill="#242C32">Free / amidated</text>
<rect id="B-object-1" x="161" y="117.0" width="167" height="43" fill="#F0F5F8" stroke="#25648A" stroke-width="0.65"/>
<text id="B-object-1-name" x="244.5" y="134.0" text-anchor="middle" font-family="DejaVu Sans" font-size="9.4" font-weight="700" fill="#242C32">Four generators</text>
<text id="B-object-1-detail" x="244.5" y="149.0" text-anchor="middle" font-family="DejaVu Sans" font-size="9.4" font-weight="400" fill="#242C32">16 sequences per group</text>
<rect id="B-object-2" x="353" y="117.0" width="153" height="43" fill="#F0F5F8" stroke="#25648A" stroke-width="0.65"/>
<text id="B-object-2-name" x="429.5" y="134.0" text-anchor="middle" font-family="DejaVu Sans" font-size="9.4" font-weight="700" fill="#242C32">Six sequence distances</text>
<text id="B-object-2-detail" x="429.5" y="149.0" text-anchor="middle" font-family="DejaVu Sans" font-size="9.4" font-weight="400" fill="#242C32">LSTM comparator</text>
