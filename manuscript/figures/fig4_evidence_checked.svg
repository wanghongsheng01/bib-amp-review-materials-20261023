<text id="C-object-0-detail" x="70.0" y="231.0" text-anchor="middle" font-family="DejaVu Sans" font-size="9.4" font-weight="400" fill="#242C32">Four bacterial strains</text>
<rect id="C-object-1" x="161" y="199.0" width="167" height="43" fill="#FCF7ED" stroke="#B88426" stroke-width="0.65"/>
<text id="C-object-1-name" x="244.5" y="216.0" text-anchor="middle" font-family="DejaVu Sans" font-size="9.4" font-weight="700" fill="#242C32">Triplicate dilution assays</text>
<text id="C-object-1-detail" x="244.5" y="231.0" text-anchor="middle" font-family="DejaVu Sans" font-size="9.4" font-weight="400" fill="#242C32">OD600 to MIC</text>
<rect id="C-object-2" x="353" y="199.0" width="153" height="43" fill="#FCF7ED" stroke="#B88426" stroke-width="0.65"/>
